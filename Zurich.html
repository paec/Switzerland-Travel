    .facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.fact{padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--soft)}.fact strong{display:block;color:var(--accent);font-size:1.12rem;line-height:1.35}.fact span{display:block;margin-top:4px;color:var(--muted);font-size:.82rem}
    .route{display:grid;gap:12px}.stop{display:grid;grid-template-columns:54px 140px 1fr auto;gap:14px;align-items:start;padding:16px 17px;background:var(--card);border:1px solid var(--line);border-radius:17px;box-shadow:0 5px 20px rgba(17,54,76,.07)}.stop-image{width:140px;height:90px;object-fit:cover;border-radius:12px;background:#e7eef2}.stop-image.contain{object-fit:contain}.num{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,var(--navy),var(--blue));color:#fff;font-weight:850}.stop h3{font-size:1rem;margin:0 0 3px}.stop p{color:var(--muted);font-size:.91rem;margin:0}.stop-description-list{list-style:none;display:grid;gap:7px;margin:10px 0 0;padding:0}.stop-description-list li{position:relative;padding-left:30px;color:var(--muted);font-size:.91rem;line-height:1.65}    .item-symbol{position:absolute;top:0;left:0;display:inline-flex;width:24px;height:1.65em;align-items:center;justify-content:center;color:var(--accent);font-weight:900;line-height:1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}.tag{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:999px;background:rgba(201,222,230,.56);color:#1e5368;border:1px solid rgba(19,75,98,.12);font-size:.72rem;font-weight:800;vertical-align:2px}.tag strong{color:inherit}.stop-links{display:flex;flex-wrap:wrap;align-items:flex-start;gap:7px}.map,.source-link{display:inline-flex;gap:5px;align-items:center;text-decoration:none;font-size:.84rem;font-weight:800;padding:7px 9px;border-radius:10px;white-space:nowrap}.map{color:var(--blue);background:#eef7ff}.source-link{color:#8b5c10;background:#fff7e8}.arrow{height:12px;margin-left:26px;border-left:2px dashed #96b7c7}

    @media(max-width:700px){.wrap{width:min(1080px,calc(100% - 20px))}.hero{min-height:390px;padding:60px 0 42px}.intro{grid-template-columns:1fr}.metric{text-align:left}.route-overview{padding:17px}.timeline{margin-right:-17px;padding-right:17px}.timeline-stop{min-width:116px}.facts{grid-template-columns:repeat(2,minmax(0,1fr))}.stop{grid-template-columns:1fr;grid-template-areas:"num" "content" "links" "image";gap:10px;padding:14px}.stop>.num{grid-area:num}.stop-image{width:100%;height:clamp(150px,48vw,230px);grid-area:image;object-fit:cover}.stop>div:nth-of-type(2){grid-area:content;min-width:0}.stop>.stop-links{grid-area:links}.stop-links .map,.stop-links .source-link{width:auto;justify-content:flex-start}.arrow{margin-left:20px}.grid{grid-template-columns:1fr}.photo{margin:-17px -17px 16px}.tabs .tab{padding:9px 11px}.section-card{padding:17px}.reference-link{align-items:flex-start;flex-direction:column;gap:3px}}

<body>
<header class="hero">
  <div class="wrap">
    <a class="back-home" href="index.html" aria-label="返回首頁">← 返回首頁</a>
    <span class="eyebrow">🇨🇭 ZÜRICH · 城市湖畔一日環線</span>
    <h1>蘇黎世</h1>
    <p>從中央車站走完西岸精華，搭短程大湖遊船前往巧克力博物館，再以 165 號公車回到 Bürkliplatz，最後沿東岸老城走回中央車站。</p>
    <a class="notes-link" href="https://hackmd.io/ZxHTzNzdRIS1dBsUXMlCpw" target="_blank" rel="noopener noreferrer">📒 開啟完整筆記 ↗</a>
    <div class="hero-meta">
      <span class="pill">🚶 西岸＋東岸徒步</span>
      <span class="pill">🚢 大湖短程遊船</span>
      <span class="pill">🍫 Lindt 巧克力博物館</span>
      <span class="pill">🏨 機場住宿</span>
    </div>
  </div>
</header>
<nav class="sticky-tabs"><div class="wrap tabs" id="topTabs"></div></nav>
<main class="wrap main" id="planContainer"></main>
<nav class="bottom-nav">

  </div>
</nav>
<script>
const topTabs=document.getElementById('topTabs');
const bottomTabs=document.getElementById('bottomTabs');
const planContainer=document.getElementById('planContainer');
const maps=query=>`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
const placeholder=(text,index)=>`https://placehold.co/640x360/e7eef2/5d6c7d?text=${encodeURIComponent(text+' '+index)}`;
const imageSources={
  hero:'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ6enZa-pQsIE_PmIW5c6erG6Bp8JVScdbms0WnYsGMLQ&s=10',
  west:'https://g.udn.com.tw/upfiles/B_IC/ice2005/PSN_PHOTO/333/f_28364333_1.jpg',
  cruise:'https://upload.wikimedia.org/wikipedia/commons/thumb/e/e9/K%C3%A4ferberg_-_Lindenhof_-_Schipfe_-_Limmat_-_Sicht_vom_Grossm%C3%BCnster_Karlsturm_IMG_6425.JPG/1920px-K%C3%A4ferberg_-_Lindenhof_-_Schipfe_-_Limmat_-_Sicht_vom_Grossm%C3%BCnster_Karlsturm_IMG_6425.JPG?utm_source=zh.wikipedia.org&utm_campaign=index&utm_content=thumbnail',

  church: 'https://lh3.googleusercontent.com/gps-cs-s/AHRPTWlkvvNSteFQH1boMIHK4VWHiUqr3VsF2jH4ksiHl927GqjuBKgfulMna_2nV9g2zZ3wlzo2NfFjJoL56gwEPVNgJxiLcH2w6hMQCswL-EPj9Yb3jLZW7O2MixiijMjCY7UJYwBP=s1360-w1360-h1020-rw',
  mainStreet: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTfeNwaYvshmI4E2dtmPLBv-0fMsqBFgvjgI8OGXEBIRQ&s=10',
  lakeshore: 'https://media.zuerich.com/image/727218228053/image_fj7tdjfgh13bn02ufl4lif3a2b/-FWEBP%2CQ85-C1367x819%2C0%2C615-S2432x1458',
  opernhaus: 'https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTP-Yq9974Dwcm9q2-Vc_JOgeSyuK3H0EqhxttJlSR4Ug&s=10',
  church2: 'https://static.liontech.com.tw/DS/go_images/1/6712/6713/6714/Q684948/Zurich_city1.webp',
  niderdorf: 'https://c8.alamy.com/comp/2WP2AEX/zurich-switzerland-april-3-2022-niederdorfstrasse-is-one-of-the-most-popular-recreational-areas-in-altstadt-old-town-on-april-3-in-zurich-swi-2WP2AEX.jpg',
  swiss_museum: 'https://lh3.googleusercontent.com/gps-cs-s/AHRPTWmThs9LgmQxky5HEKKWShTHCxnO90aMHf-TPWV5ni2rzbcjp8P9gFN5aHqDAtkTLhjBedPFgFSVo-8tIw-edfv7T7trLlhHNWWbdidtnYYFC7sY3cwzC-2eI6fPNkvZAY2w0mmKHA=s1360-w1360-h1020-rw',
  zurich_view: 'https://images.contentstack.io/v3/assets/blt06f605a34f1194ff/blt3feae4b375474a37/67ec32e1901312c94406c43c/BCC-2024-EXPLORER-ZURICH-FUN-THINGS-TO-DO-HEADER_MOBILE.jpg?fit=crop&auto=webp&quality=60&crop=smart&format=avif',
  coop:'https://bigsharkgogogo.tw/wp-content/uploads/2025/09/coopbuffet-32.webp',
  ShopVille:'https://dynamic-media-cdn.tripadvisor.com/media/photo-o/34/00/37/ed/caption.jpg?w=1400&h=-1&s=1',
}
const imageURL=(name,index)=>imageSources[name]||placeholder(name,index);

const travelNameCatalog=[
  'Zürich HB','中央車站','班霍夫大街','Bahnhofstrasse','林登霍夫山','Lindenhof',
  '奧古斯丁巷','Augustinergasse','聖彼得教堂','St. Peter','聖母大教堂','Fraumünster',
  '軍械庫餐廳','Zeughauskeller','Bürkliplatz','Bürkliterrasse','Ganymede',
  '蘇黎世湖','Lake Zurich','Kilchberg ZH','Lindt Home of Chocolate','巧克力博物館',
  '165 號公車','Seestrasse','Quaibrücke','塞克瑟洛伊滕廣場','Sechseläutenplatz',
  '蘇黎世歌劇院','Utoquai','Limmatquai','利馬特河岸大道','Grossmünster',
  '蘇黎世大教堂','Rathaus','蘇黎世市政廳','Niederdorf','瑞士國立博物館',
  '蘇黎世車站地下街','Migros','Coop','Brezelkönig','Holiday Inn Express Zürich Airport',
  'Rümelbach','Zürich Oerlikon','琉森','Luzern', 'Kilchberg ZH (lake)'
];
const travelNamePattern=new RegExp(`(${travelNameCatalog.map(value=>value.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).sort((a,b)=>b.length-a.length).join('|')})`,'gi');

function boldTravelTerms(text){
  if(!text||typeof text!=='string') return text;
  return text.split(/(<[^>]+>)/g).map(part=>{
    if(part.startsWith('<')&&part.endsWith('>')) return part;
    return part.replace(travelNamePattern,'<strong>$1</strong>');
  }).join('');
}

document.documentElement.style.setProperty('--hero-image',`url("${imageSources.hero}")`);

const travelData={tabs:[
  {
    id:'route',type:'route',label:'完整環線',icon:'🧭',
    title:'完整一日路線｜西岸 → 巧克力 → 東岸',
    accent:'#075fae',subtitle:'把四個階段串成一條大環線：上午西岸徒步，中午湖上移動與巧克力博物館，下午搭 165 號公車回市區，再沿東岸老城北上回到中央車站。',metric:'一日環線',
    notice:'遊船班次、Lindt Home of Chocolate 的開放時間與 165 號公車時刻，請出發前再次確認；整體路線以步行為主，建議保留用餐與湖畔折返的彈性。',
    overview:{chips:['西岸精華徒步','Short Lake Cruise','165 號公車','東岸老城環線'],timeline:[
      {name:'Zürich HB',note:'上午出發'},
      {name:'西岸精華',note:'一路向南',mode:'🚶'},
      {name:'Bürkliplatz',note:'登船',mode:'📍'},
      {name:'Kilchberg',note:'約 25 分鐘',mode:'🚢'},
      {name:'Lindt Home',note:'參觀與購物',mode:'🍫'},
      {name:'Bürkliplatz',note:'約 13 分鐘',mode:'🚌'},
      {name:'東岸老城',note:'一路向北',mode:'🚶'},
      {name:'Zürich HB',note:'完成環線',mode:'🏁'}
    ]},
    stops:[
      {name:'Zürich HB 與班霍夫大街',image:imageSources.mainStreet,description:'🚉 從【中央車站 Zürich HB】出發，進入班霍夫大街；這裡同時是整圈路線的起點與最後回到的終點。<br>🛍️ 班霍夫大街是貫穿西岸南北的中央主軸，後續景點多從這條街向東延伸。<br>🍽️ 一早需要補給時，可順路 Coop 或 Migros (也都有附設餐廳)。',map:'Zürich HB, Zürich',tag:'起點'},
      {name:'林登霍夫山與奧古斯丁巷',image:imageSources.west,description:'🌿 從班霍夫大街向東走，先到林登霍夫山看城市與利馬特河，再穿過奧古斯丁巷。<br>📷 這段適合慢慢拍照，街巷景點依序步行即可串起。<br>🍽️ 軍械庫餐廳 Zeughauskeller 位於奧古斯丁巷與聖彼得教堂之間，為彈性拍照點。',map:'Lindenhof, Zürich',tag:'上午'},

function header(plan){
  return `<section class="intro"><div><div class="kicker">${plan.type==='guide'?'Guide Content':'Daily Route'}</div><h2>${boldTravelTerms(plan.title)}</h2><p>${boldTravelTerms(plan.subtitle)}</p></div><div class="metric"><strong>${plan.metric}</strong><span>${plan.type==='guide'?'重點':''}</span></div></section>`;
}

function sourceHTML(source){
  return source?`<a class="source-link" target="_blank" rel="noopener" href="${source.url}">${source.label} ↗</a>`:'';
}

function cleanItemText(text){return text.trim().replace(/^[^\p{L}\p{N}\s]+/u,'').trim();}

function itemHTML(text){
  const trimmedText=text.trim();
  const symbolMatch=trimmedText.match(/^[^\p{L}\p{N}\s]+/u);
  const symbol=symbolMatch?symbolMatch[0]:'✦';
  const cleanText=boldTravelTerms(cleanItemText(trimmedText));
  return `<li><span class="item-symbol" aria-hidden="true">${symbol}</span>${cleanText}</li>`;
}

function stopHTML(stop,index){
  const image=stop.image||imageURL(stop.name,index+1);
  const bulletText=stop.description.includes('<br>')?stop.description.split('<br>').map(part=>part.trim()).filter(Boolean).map(itemHTML).join(''):'';
  const descriptionMarkup=bulletText?`<ul class="stop-description-list">${bulletText}</ul>`:`<p>${boldTravelTerms(stop.description)}</p>`;
  return `${index?'<div class="arrow"></div>':''}<article class="stop"><div class="num">${String(index+1).padStart(2,'0')}</div><img class="stop-image" src="${image}" alt="${stop.name} 圖片" loading="lazy"><div><h3>${boldTravelTerms(stop.name)}${stop.tag?`<span class="tag">${stop.tag}</span>`:''}</h3>${descriptionMarkup}</div><div class="stop-links"><a class="map" target="_blank" rel="noopener" href="${maps(stop.map)}">地圖 ↗</a>${sourceHTML(stop.source)}</div></article>`;
}

function highlightHTML(highlight){
  const image=highlight.image||imageSources[highlight.title]||'';
  const media=image?`<img loading="lazy" src="${image}" alt="${highlight.title}">`:`<span class="text-photo-icon">${highlight.icon||'✦'}</span>`;
  const photoClass=image?'':' text-photo';
  return `<section class="section-card"><div class="photo${photoClass}">${media}</div><h3>${boldTravelTerms(highlight.title)}</h3><p>${boldTravelTerms(highlight.description)}</p></section>`;
}

function overviewHTML(plan){
  const overview=plan.overview;
  if(!overview) return '';
  const timeline=overview.timeline.map((stop,index)=>`${index?`<div class="connector"><b>${stop.mode||'→'}</b><small>${stop.note||'移動'}</small></div>`:''}<div class="timeline-stop"><span>${stop.name}</span>${stop.note&&!index?`<small>${stop.note}</small>`:''}</div>`).join('');
  return `<section class="route-overview" aria-label="路線總覽"><div class="section-heading overview-heading"><h2>路線總覽</h2><p>用一條流程線快速掌握整體方向，再查看下方的停靠點細節。</p></div><div class="chips">${overview.chips.map(chip=>`<span class="chip">${chip}</span>`).join('')}</div><div class="timeline" aria-label="蘇黎世推薦玩法時間軸">${timeline}</div></section>`;
}

function factsHTML(plan){
  if(!plan.facts?.length) return '';
  return `<section class="route-overview" aria-label="內容摘要"><div class="section-heading overview-heading"><h2>內容摘要</h2><p>先用幾個關鍵數字掌握這個 Tab 的用途。</p></div><div class="facts">${plan.facts.map(fact=>`<div class="fact"><strong>${boldTravelTerms(fact.value)}</strong><span>${boldTravelTerms(fact.label)}</span></div>`).join('')}</div></section>`;
}

function guideSectionsHTML(plan){
  return `<div class="section-heading"><h2>重點內容</h2></div><div class="grid">${plan.sections.map(section=>`<section class="section-card guide-section"><h3>${boldTravelTerms(section.title)}</h3><p>${boldTravelTerms(section.description)}</p><ul>${section.items.map(itemHTML).join('')}</ul></section>`).join('')}</div>`;
}

function linksHTML(plan){
  if(!plan.links?.length) return '';
  return `<div class="section-heading"><h2>參考連結</h2><p>開啟官方交通、景點或住宿資訊，出發前再確認最新狀態。</p></div><section class="section-card"><div class="link-list">${plan.links.map(link=>`<a class="reference-link" target="_blank" rel="noopener" href="${link.url}"><span>${boldTravelTerms(link.label)}</span><span>開啟連結 ↗</span></a>`).join('')}</div></section>`;
}

function checklistHTML(plan,title,description){
  return `<div class="section-heading"><h2>${title}</h2><p>${boldTravelTerms(description)}</p></div><section class="section-card"><div class="checklist">${plan.checks.map((check,index)=>`<label class="check"><input type="checkbox" data-key="${plan.id}-${index}"><span>${boldTravelTerms(check)}</span></label>`).join('')}</div></section>`;
}

function renderRoutePlan(plan){
  return `<section class="plan" id="${plan.id}" style="--accent:${plan.accent||'var(--blue)'}">${header(plan)}<div class="notice"><strong>行程提醒：</strong>${plan.notice}</div>${overviewHTML(plan)}<div class="section-heading"><h2>行程路線</h2><p>依四個階段與實際停靠順序列出完整環線。</p></div><div class="route">${plan.stops.map(stopHTML).join('')}</div><div class="section-heading"><h2>特色照片與重點</h2><p>這條路線最具代表性的城市、湖景與體驗。</p></div><div class="grid">${plan.highlights.map(highlightHTML).join('')}</div>${linksHTML(plan)}${checklistHTML(plan,'出發前 Checklist','勾選狀態會保存在目前瀏覽器。')}</section>`;
}

function renderGuidePlan(plan){
  return `<section class="plan" id="${plan.id}" style="--accent:${plan.accent||'var(--blue)'}">${header(plan)}${factsHTML(plan)}${guideSectionsHTML(plan)}<div class="section-heading"><h2>特色照片與重點</h2><p>最具代表性的景觀、體驗或實用主題。</p></div><div class="grid">${plan.highlights.map(highlightHTML).join('')}</div>${linksHTML(plan)}${checklistHTML(plan,'Checklist','勾選狀態會保存在目前瀏覽器。')}</section>`;
}

function renderPlan(plan){return plan.type==='guide'?renderGuidePlan(plan):renderRoutePlan(plan);}
function renderPlans(){planContainer.innerHTML=travelData.tabs.map(renderPlan).join('');restoreChecks();}
function renderTabs(){
  const tabs=travelData.tabs.map(plan=>`<button class="tab" data-target="${plan.id}"><span class="icon">${plan.icon}</span><span>${plan.label}</span></button>`).join('');
  topTabs.innerHTML=tabs;
  bottomTabs.innerHTML=tabs;
}
function showPlan(id,updateHash=true,shouldScroll=true){
  document.querySelectorAll('.plan').forEach(plan=>plan.classList.toggle('active',plan.id===id));
  document.querySelectorAll('[data-target]').forEach(tab=>tab.classList.toggle('active',tab.dataset.target===id));
  if(updateHash) history.replaceState(null,'',`#${id}`);
  if(shouldScroll){
    const main=document.getElementById('planContainer');
    const sticky=document.querySelector('.sticky-tabs');
    const targetY=main?main.offsetTop-(sticky?sticky.offsetHeight:0)-12:0;
    window.scrollTo({top:Math.max(targetY,0),left:0,behavior:'smooth'});
  }
}
function restoreChecks(){
  document.querySelectorAll('[data-key]').forEach(checkbox=>{
    const key=`zurich-travel-${checkbox.dataset.key}`;
    checkbox.checked=localStorage.getItem(key)==='1';
    checkbox.onchange=()=>localStorage.setItem(key,checkbox.checked?'1':'0');
  });
}

renderTabs();
renderPlans();
document.addEventListener('click',event=>{
  const tab=event.target.closest('[data-target]');
  if(tab) showPlan(tab.dataset.target);
});
const planIds=travelData.tabs.map(plan=>plan.id);
const initialPlan=planIds.includes(location.hash.slice(1))?location.hash.slice(1):planIds[0];
showPlan(initialPlan,false,false);
window.addEventListener('hashchange',()=>{
  const id=location.hash.slice(1);
  if(planIds.includes(id)) showPlan(id,false,false);
});
</script>
</body>
</html>
