<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#075985">
  <title>旅行規劃樣板｜多行程完整分頁</title>
  <style>
    :root{--navy:#073763;--blue:#075fae;--teal:#078577;--ink:#10243e;--muted:#607184;--bg:#edf5f8;--card:#fff;--line:#d7e5ed;--soft:#f5fafc;--amber:#d97706;--shadow:0 10px 30px rgba(17,54,76,.12);--radius:20px;--safe:env(safe-area-inset-bottom,0px)}
    *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:linear-gradient(180deg,#e7f3f7 0,#f7fafb 36rem);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;line-height:1.65}img{display:block;max-width:100%}button,a{font:inherit}a{color:inherit}.wrap{width:min(1080px,calc(100% - 28px));margin:auto}
    .hero{min-height:440px;color:#fff;background:linear-gradient(112deg,rgba(3,39,78,.96),rgba(5,123,139,.76)),url('https://images.unsplash.com/photo-1527668752968-14dc70a27c95?auto=format&fit=crop&w=1800&q=85') center/cover;display:flex;align-items:end;padding:78px 0 62px}.eyebrow{display:inline-flex;gap:8px;align-items:center;padding:7px 12px;border:1px solid #ffffff55;border-radius:999px;background:#ffffff18;backdrop-filter:blur(8px);font-size:.88rem;font-weight:700}.hero h1{font-size:clamp(2.7rem,8vw,5.6rem);line-height:1;margin:18px 0 14px;letter-spacing:-.04em}.hero p{max-width:720px;margin:0;color:#e5f6fa;font-size:clamp(1rem,2.4vw,1.22rem)}.hero-meta{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}.pill{padding:8px 12px;background:#ffffff18;border:1px solid #ffffff35;border-radius:12px;font-size:.9rem}
    .sticky-tabs{position:sticky;top:0;z-index:20;background:#ffffffee;border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}.tabs{display:flex;gap:6px;overflow:auto;padding:10px 0;scrollbar-width:none}.tab{white-space:nowrap;border:0;background:transparent;color:var(--muted);padding:10px 14px;border-radius:12px;font-weight:750;cursor:pointer}.tab.active{color:#fff;background:var(--navy);box-shadow:0 6px 18px #07376335}.main{padding:28px 0 calc(105px + var(--safe))}.plan{display:none;animation:rise .35s ease}.plan.active{display:block}@keyframes rise{from{opacity:0;transform:translateY(8px)}}
    .intro,.route-overview,.section-card,.notice{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}.intro{padding:24px;margin-bottom:18px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center}.kicker{color:var(--teal);font-size:.83rem;font-weight:850;letter-spacing:.12em;text-transform:uppercase}.intro h2,.section-title{margin:4px 0 5px;line-height:1.2}.intro p{margin:0;color:var(--muted)}.metric{min-width:128px;text-align:center;background:#edf8f6;border-radius:16px;padding:14px}.metric strong{display:block;font-size:1.45rem;color:var(--teal)}
    .section-heading{margin:28px 0 12px}.section-heading h2{margin:0;font-size:1.35rem}.section-heading p{margin:3px 0 0;color:var(--muted)}
    .route-overview{padding:21px;border-top:5px solid var(--accent);margin-bottom:22px}.overview-heading{margin:0 0 12px}.route-text{font-weight:750;line-height:1.7}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.chip{background:color-mix(in srgb,var(--accent) 10%,white);color:var(--accent);padding:7px 10px;border-radius:999px;font-size:.82rem;font-weight:800}.timeline{display:flex;align-items:center;overflow-x:auto;gap:0;padding:18px 2px 5px;scroll-snap-type:x proximity;scrollbar-width:thin}.timeline-stop{min-width:126px;text-align:center;scroll-snap-align:start}.timeline-stop span{display:block;background:#fff;border:1px solid color-mix(in srgb,var(--accent) 35%,white);border-radius:12px;padding:10px 7px;font-weight:850}.timeline-stop small{display:block;margin-top:5px;color:var(--muted);font-size:.78rem;white-space:nowrap}.connector{min-width:72px;text-align:center;color:var(--accent);font-weight:900}.connector b{display:block;font-size:22px;line-height:1}.connector small{display:block;margin-top:4px;font-size:.75rem;white-space:nowrap}
    .route{display:grid;gap:12px}.stop{display:grid;grid-template-columns:54px 140px 1fr auto;gap:14px;align-items:start;padding:16px 17px;background:var(--card);border:1px solid var(--line);border-radius:17px;box-shadow:0 5px 20px rgba(17,54,76,.07)}.stop-image{width:140px;height:90px;object-fit:cover;border-radius:12px;background:#e7eef2}.num{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,var(--navy),var(--blue));color:#fff;font-weight:850}.stop h3{font-size:1rem;margin:0 0 3px}.stop p{color:var(--muted);font-size:.91rem;margin:0}.tag{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:999px;background:#fff3d8;color:#9a5a00;font-size:.72rem;font-weight:800;vertical-align:2px}.map{display:inline-flex;gap:5px;align-items:center;text-decoration:none;color:var(--blue);font-size:.85rem;font-weight:800;padding:7px 9px;border-radius:10px;background:#eef7ff}.arrow{height:12px;margin-left:26px;border-left:2px dashed #96b7c7}
    .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.section-card{padding:21px}.section-card h3{margin:0 0 10px}.section-card p{color:var(--muted)}.notice{padding:17px 19px;margin:16px 0;border-left:5px solid var(--amber);box-shadow:none;background:#fffaf0}.notice strong{color:#955706}.photo{min-height:220px;border-radius:18px;overflow:hidden;position:relative;background:#b9d2dc;margin:-21px -21px 16px}.photo img{width:100%;height:100%;object-fit:cover;position:absolute}.photo span{position:absolute;left:12px;bottom:12px;color:#fff;background:#062f49c9;border:1px solid #ffffff40;border-radius:10px;padding:6px 9px;font-size:.8rem;font-weight:750}.checklist{display:grid;gap:10px}.check{display:flex;gap:11px;align-items:flex-start;padding:13px;border:1px solid var(--line);border-radius:14px;background:var(--soft);cursor:pointer}.check input{width:20px;height:20px;accent-color:var(--teal);margin-top:2px}.check:has(input:checked){opacity:.58;text-decoration:line-through}.back-home{display:inline-flex;align-items:center;gap:6px;margin-bottom:14px;padding:8px 14px;border:1px solid rgba(255,255,255,.55);border-radius:999px;background:rgba(255,255,255,.14);color:#fff;font-size:.88rem;font-weight:800;text-decoration:none;backdrop-filter:blur(8px)}.back-home:hover{background:rgba(255,255,255,.26)}.bottom-nav{position:fixed;right:0;bottom:0;left:0;z-index:30;background:#ffffffed;border-top:1px solid var(--line);backdrop-filter:blur(16px);padding-bottom:var(--safe)}.bottom-tabs{display:flex;align-items:center;justify-content:center;max-width:620px;margin:auto;padding:7px}.bottom-tabs .tab,.bottom-tabs .home-link{display:grid;gap:1px;place-items:center;font-size:.73rem;padding:6px 10px;border-radius:12px}.bottom-tabs .home-link{text-decoration:none;color:#075fae;background:#edf6ff;font-weight:750}.bottom-plan-tabs{display:flex;justify-content:space-around;flex:1}.bottom-tabs .icon{font-size:1.2rem}
    @media(max-width:700px){.wrap{width:min(1080px,calc(100% - 20px))}.hero{min-height:390px;padding:60px 0 42px}.intro{grid-template-columns:1fr}.metric{text-align:left}.route-overview{padding:17px}.timeline{margin-right:-17px;padding-right:17px}.timeline-stop{min-width:116px}.stop{grid-template-columns:clamp(36px,12vw,42px) minmax(0,1fr) clamp(72px,22vw,84px);gap:10px clamp(8px,3vw,12px);padding:14px}.stop>.num{grid-column:1;grid-row:1 / span 2}.stop-image{width:100%;height:68px;grid-column:3;grid-row:1 / span 2}.stop>div:nth-of-type(2){grid-column:2;grid-row:1 / span 2;min-width:0}.stop>.map{grid-column:2 / -1;grid-row:3;width:100%;justify-content:flex-start}.arrow{margin-left:20px}.grid{grid-template-columns:1fr}.photo{margin:-17px -17px 16px}.tabs .tab{padding:9px 11px}.section-card{padding:17px}}
    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
<header class="hero"><div class="wrap"><a class="back-home" href="index.html" aria-label="返回首頁">← 返回首頁</a><span class="eyebrow">🇨🇭 DESTINATION · 旅行規劃樣板</span><h1>旅行地點</h1><p>每個 Tab 代表一套獨立且完整的行程，內含路線、特色照片、提醒與行前確認。</p><div class="hero-meta"><span class="pill">🚶 行程路線</span><span class="pill">📷 特色照片</span><span class="pill">✅ 行前確認</span></div></div></header>
<nav class="sticky-tabs"><div class="wrap tabs" id="topTabs"></div></nav>
<main class="wrap main" id="planContainer"></main>
<nav class="bottom-nav"><div class="bottom-tabs"><a class="home-link" href="index.html" aria-label="首頁"><span class="icon">⌂</span><span>首頁</span></a><div class="bottom-plan-tabs" id="bottomTabs"></div></div></nav>
<script>
const maps=q=>`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
const placeholder=(text,index)=>`https://placehold.co/640x360/e7eef2/5d6c7d?text=${encodeURIComponent(text+' '+index)}`;

/* 每個物件就是一個完整 Tab／完整行程。後續新增頁面時，複製一個物件再替換內容。 */
const travelData={tabs:[
  {
    id:'city',label:'城市經典',icon:'🚶',title:'第一套｜舊城經典步行',
    accent:'#075fae',subtitle:'從主要車站出發，以順路動線串起地標、廣場與高處景觀。',metric:'約 5～7 小時',
    notice:'登高景點與室內場館可能有季節或營業時間限制，出發前請再次確認。',
    overview:{route:'🚶 主要火車站 → 代表性木橋 → 舊城廣場群 → 城市觀景點',chips:['約 5～7 小時','步行為主','可彈性刪減'],timeline:[{name:'主要火車站',note:'行程起點'},{name:'代表性木橋',note:'步行',mode:'🚶'},{name:'舊城廣場群',note:'停留約 1 小時',mode:'🚶'},{name:'城市觀景點',note:'視體力安排',mode:'🚶'}]},
    stops:[
      ['主要火車站','由主要交通節點開始行程。','Luzern Bahnhof'],
      ['代表性木橋','安排城市地標與拍照停留。','Kapellbrücke Luzern'],
      ['舊城廣場群','串接街區、廣場與沿途特色建築。','Kornmarkt Luzern','彈性'],
      ['城市觀景點','登高俯瞰城市，留意現場開放狀況。','Museggmauer Luzern']
    ],
    highlights:[
      ['城市地標與河景','使用寬幅照片呈現此行程最具代表性的景色。','https://images.unsplash.com/photo-1502784444187-359ac186c5bb?auto=format&fit=crop&w=1200&q=80'],
      ['舊城街區氛圍','補充建築、街道或地方文化等第二項特色。','https://images.unsplash.com/photo-1527668752968-14dc70a27c95?auto=format&fit=crop&w=1200&q=80']
    ],
    checks:['確認步行距離與天氣','確認景點開放時間','穿著防滑好走的鞋','攜帶飲水與薄外套']
  },
  {
    id:'castle',label:'湖畔城堡',icon:'🏰',title:'第二套｜湖畔城堡行程',
    accent:'#078577',subtitle:'以特色交通前往郊區景點，並保留備用交通方案。',metric:'約 3～4 小時',
    notice:'先查主要交通班次；等待過久就切換備用方案，避免壓縮後續行程。',
    overview:{route:'🚆 市區交通節點 → 🚢 湖上交通體驗 → 城堡與花園 → 半島湖岸',chips:['約 3～4 小時','船班限定','保留回程緩衝'],timeline:[{name:'市區交通節點',note:'確認班次'},{name:'特色交通體驗',note:'搭船或接駁',mode:'🚢'},{name:'城堡與花園',note:'停留約 1.5 小時',mode:'🚶'},{name:'半島湖岸',note:'注意回程',mode:'🚶'}]},
    stops:[
      ['市區交通節點','先確認當日班次與上車位置。','Luzern Bahnhofquai'],
      ['特色交通體驗','沿途欣賞湖面、岸線與山景。','Lake Lucerne'],
      ['城堡與花園','安排建築、花園與主要景觀。','Schloss Meggenhorn'],
      ['半島湖岸','走到外緣看湖景，再依班次返回。','Meggenhorn Schiffstation','注意回程']
    ],
    highlights:[
      ['城堡花園與湖景','說明城堡、草地與湖景交疊的主要亮點。','https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1200&q=85'],
      ['特色交通與沿途風景','呈現前往景點途中的旅行感與景觀。','https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=85']
    ],
    checks:['查詢去回程班次','準備備用交通方案','確認末班時間','預留步行與候車緩衝']
  },
  {
    id:'daytrip',label:'郊區一日',icon:'⛰️',title:'第三套｜郊區景觀一日遊',
    accent:'#b45309',subtitle:'安排較長距離的自然景觀行程，並依天候決定是否執行。',metric:'約 7～9 小時',
    notice:'此類行程受天氣影響較大；若能見度不佳，可改為市區或室內備案。',
    overview:{route:'🚆 市區出發 → 湖畔小鎮 → 山區交通 → 山頂景觀 → 返回市區',chips:['約 7～9 小時','天候限定','提早出發較從容'],timeline:[{name:'市區出發',note:'提早出發'},{name:'湖畔小鎮',note:'轉乘上山',mode:'🚆'},{name:'山區交通',note:'依班次移動',mode:'🚡'},{name:'山頂景觀',note:'預留回程時間',mode:'⛰️'}]},
    stops:[
      ['市區出發','提早出發並確認轉乘節點。','Luzern Bahnhof'],
      ['湖畔小鎮','短暫停留並銜接上山交通。','Weggis Switzerland'],
      ['山區交通','依纜車或登山列車班次移動。','Rigi Kaltbad'],
      ['山頂景觀','預留觀景、用餐與回程時間。','Rigi Kulm','天候限定']
    ],
    highlights:[
      ['山湖全景','以大景照片呈現此行程的核心吸引力。','https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1200&q=85'],
      ['湖畔小鎮','補充途中停靠點與較悠閒的旅行節奏。','https://images.unsplash.com/photo-1527668752968-14dc70a27c95?auto=format&fit=crop&w=1200&q=80']
    ],
    checks:['確認山區天氣與能見度','確認纜車或登山列車營運','攜帶保暖及防風衣物','反推最晚下山時間']
  }
]};

function header(t){return `<section class="intro"><div><div class="kicker">Complete Travel Plan</div><h2>${t.title}</h2><p>${t.subtitle}</p></div><div class="metric"><strong>${t.metric}</strong><span>建議安排</span></div></section>`}
function stopHTML(s,i){return `${i?'<div class="arrow"></div>':''}<article class="stop"><div class="num">${String(i+1).padStart(2,'0')}</div><img class="stop-image" src="${placeholder(s[0],i+1)}" alt="${s[0]} 圖片" loading="lazy"><div><h3>${s[0]}${s[3]?`<span class="tag">${s[3]}</span>`:''}</h3><p>${s[1]}</p></div><a class="map" target="_blank" rel="noopener" href="${maps(s[2])}">地圖 ↗</a></article>`}
function highlightHTML(h){return `<section class="section-card"><div class="photo"><img loading="lazy" src="${h[2]}" alt="${h[0]}"><span>${h[0]}</span></div><h3>${h[0]}</h3><p>${h[1]}</p></section>`}
function overviewHTML(t){const o=t.overview;if(!o)return '';return `<section class="route-overview" aria-label="路線總覽"><div class="section-heading overview-heading"><h2>路線總覽</h2><p>先掌握整體方向，再查看下方的停靠點細節。</p></div><div class="route-text">${o.route}</div><div class="chips">${o.chips.map(x=>`<span class="chip">${x}</span>`).join('')}</div><div class="timeline" aria-label="推薦玩法時間軸">${o.timeline.map((x,i)=>`${i?`<div class="connector"><b>${x.mode||'→'}</b><small>${x.note||'移動'}</small></div>`:''}<div class="timeline-stop"><span>${x.name}</span>${x.note&&!i?`<small>${x.note}</small>`:''}</div>`).join('')}</div></section>`}
function renderPlan(t){return `<section class="plan" id="${t.id}" style="--accent:${t.accent||'var(--blue)'}">${header(t)}<div class="notice"><strong>行程提醒：</strong>${t.notice}</div>${overviewHTML(t)}<div class="section-heading"><h2>行程路線</h2><p>依順序列出本次行程的主要停靠點。</p></div><div class="route">${t.stops.map(stopHTML).join('')}</div><div class="section-heading"><h2>特色照片與重點</h2><p>補充這套行程最具代表性的景觀或體驗。</p></div><div class="grid">${t.highlights.map(highlightHTML).join('')}</div><div class="section-heading"><h2>行前確認</h2><p>Checklist 狀態會保存在目前瀏覽器。</p></div><section class="section-card"><div class="checklist">${t.checks.map((x,i)=>`<label class="check"><input type="checkbox" data-key="${t.id}-${i}"><span>${x}</span></label>`).join('')}</div></section></section>`}
function renderPlans(){planContainer.innerHTML=travelData.tabs.map(renderPlan).join('');restoreChecks()}
function renderTabs(){const tabs=travelData.tabs.map(t=>`<button class="tab" data-target="${t.id}"><span class="icon">${t.icon}</span><span>${t.label}</span></button>`).join('');topTabs.innerHTML=tabs;bottomTabs.innerHTML=tabs}
function showPlan(id,hash=true){document.querySelectorAll('.plan').forEach(x=>x.classList.toggle('active',x.id===id));document.querySelectorAll('[data-target]').forEach(x=>x.classList.toggle('active',x.dataset.target===id));if(hash)history.replaceState(null,'','#'+id);scrollTo({top:document.querySelector('.sticky-tabs').offsetTop,behavior:'smooth'})}
function restoreChecks(){document.querySelectorAll('[data-key]').forEach(c=>{const key='travel-template-'+c.dataset.key;c.checked=localStorage.getItem(key)==='1';c.onchange=()=>localStorage.setItem(key,c.checked?'1':'0')})}
renderTabs();renderPlans();document.addEventListener('click',e=>{const b=e.target.closest('[data-target]');if(b)showPlan(b.dataset.target)});const ids=travelData.tabs.map(x=>x.id);showPlan(ids.includes(location.hash.slice(1))?location.hash.slice(1):ids[0],false);
</script>
</body>
</html>
