<header class="hero"><div class="wrap"><a class="back-home" href="index.html" aria-label="返回首頁">← 返回首頁</a><span class="eyebrow">🏔️ INTERLAKEN TOWN · 瑞士市區筆記</span><h1>因特拉肯市區</h1><p>以西站附近住宿為基地，把市中心必去景點、阿勒河與下森老城、傍晚散步，以及第三天下午的 Harder Kulm 整理成可直接使用的旅行頁面。</p><a class="notes-link" href="https://hackmd.io/_WAqBh3nQl-gpUy6rsnPXQ" target="_blank" rel="noopener noreferrer">📒 開啟完整筆記 ↗</a><div class="hero-meta"><span class="pill">📅 2027/06/13–15</span><span class="pill">🚉 Interlaken West 出發</span><span class="pill">🏔️ 兩湖與少女峰</span></div></div></header>

  hero:'https://images.unsplash.com/photo-1527668752968-14dc70a27c95?auto=format&fit=crop&w=1800&q=85',

const travelNameCatalog=[
  'Stella Hotel Interlaken','Interlaken West','Interlaken Ost','Bahnhofstrasse','Harder Kulm','Höhematte Park','Höheweg',
  'Kursaal Park','Casino Interlaken','Japanischer Garten','Stadthausplatz Unterseen','Spielmatte','Aare Dam Viewpoint',
  'Schaalbrücke','Grosse Staatsschleuse','Fischpass Dreispitz','Reckweg','Beau Rivage','Beaurivage-Brücke',

  'Reformierte Kirche Unterseen','Tourismuseum','Interlaken Art Museum','Höhematte','Höheweg'
];
const travelNamePattern=new RegExp(`(${travelNameCatalog.map(value=>value.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).sort((a,b)=>b.length-a.length).join('|')})`,'gi');

function boldTravelTerms(text) {
  if (!text || typeof text !== 'string') return text;
  return text
    .split(/(<[^>]+>)/g)
    .map(part=>{
      if (part.startsWith('<')&&part.endsWith('>')) return part;
      return part.replace(travelNamePattern,'<strong>$1</strong>');
    })
    .join('');
}

document.documentElement.style.setProperty('--hero-image',`url("${imageSources.hero}")`);

const travelData={tabs:[
  {

    facts:[{label:'住宿',value:'Stella Hotel Interlaken'},{label:'住宿位置',value:'西站 400–500 m'},{label:'步行距離',value:'約 5–7 分鐘'}],
    sections:[
      {title:'住宿資訊｜Stella Hotel Interlaken',description:'住宿設在因特拉肯西站附近，適合把西站當成每天前後移動與傍晚散步的基地。',items:['🏨 距離因特拉肯西站 400–500 m，走路約 5–7 分鐘。','📅 住宿期間為 2027/06/13–15。','↩️ 若在 2027/6/5 下午 11:59 之前取消，可獲得全額退款；2027/6/6 上午 12:00（含）之後取消，將無法退款。','💳 將在 2027/6/4 以國泰信用卡扣款。']},
      {title:'三天安排原則',description:'先去必去景點，中途可插入其他景點。',items:['🗓️ 在因特拉肯住兩天，加上第三天早上與下午。','🌊 第三天早上前往瀑布鎮，下午回到因特拉肯安排 哈德昆景觀台。','⭐ 其餘景點穿插在前兩天的零碎時間，優先完成必去景點。','🌙 剩餘景點可放進傍晚／晚上漫步路線，沿途順路補看。']},
      {title:'市區怎麼分布',description:'因特拉肯的觀光動線集中，適合用步行把車站、主街、草地、公園與河畔串起來。',items:['🚉 熱鬧區以 <strong>Höheweg (何維克街)</strong> 為骨幹，集中在 Interlaken West 與 Interlaken Ost 兩個車站之間，左右兩側有教堂與大草皮公園。','🌊 下森與阿勒河沙洲一帶也有一些商店、旅館與人潮。','🏡 離開上述區域後，多數地方屬於比較寧靜的住宅區。']}

    checks:['確認城堡教堂的開放時間與參觀規則','確認聖靈羅馬天主教堂的開放時間與參觀規則','把下森改革教堂排進下森老城路線']

  {

    notice:'市區兩座博物館適合步行安排，也能作為天氣不佳時的備案；巴倫伯格露天博物館需要搭車前往布里恩茲。STP 免費標示與開放時間請出發前再次確認。',
    facts:[{label:'天氣不佳可去參觀',value:'雨備'}],
    sections:[
      {title:'市區最代表性（步行可達）',description:'兩個市區文化點都可從因特拉肯步行安排，適合雨天或想放慢節奏時使用。',items:['🏛️ <strong>少女峰區旅遊博物館</strong>（Tourismuseum）：探索因特拉肯如何變成觀光勝地的歷史，位於下森老城。','🎨 <strong>因特拉肯美術館</strong>：欣賞現代與當代藝術，離西站最近。','🎫 原筆記標示兩處博物館皆可使用 <strong>STP 免費</strong>，票券適用條件與開放時間請出發前確認。']},
      {title:'近郊最代表性（世界級必去）',description:'若安排完整的近郊日，可把巴倫伯格露天博物館列為瑞士傳統文化的主行程。',items:['🏡 <strong>巴倫伯格露天博物館</strong>是全瑞士唯一把百棟古老木屋搬過來的巨大時光村落。','🚆 需搭車到布里恩茲，建議預留完整的近郊往返時間。','🎫 原筆記標示 <strong>STP 免費</strong>，實際適用規則與入場資訊請出發前確認。']},
    ],
    highlights:[{title:'少女峰區旅遊博物館（Tourismuseum）',description:'位於下森老城，適合把因特拉肯的觀光歷史與老城散步安排在一起。'},{title:'因特拉肯美術館',description:'離西站最近的市區文化點，適合放進市中心路線或雨天備案。'},{title:'巴倫伯格露天博物館',description:'需搭車到布里恩茲的巨大時光村落，集中欣賞瑞士傳統木屋與地方文化。'}],
    checks:['確認少女峰區旅遊博物館的開放時間與 STP 適用規則','確認因特拉肯美術館的開放時間與 STP 適用規則','評估是否安排布里恩茲與巴倫伯格露天博物館','查詢近郊交通與官方入場資訊']
  }

function header(plan) {
  return `
    <section class="intro">
      <div>
        <div class="kicker">${plan.type==='guide'?'Guide Content':'Daily Route'}</div>
        <h2>${boldTravelTerms(plan.title)}</h2>
        <p>${boldTravelTerms(plan.subtitle)}</p>
      </div>
      <div class="metric">
        <strong>${plan.metric}</strong>
        <span>${plan.type==='guide'?'重點':'建議安排'}</span>
      </div>
    </section>
  `;
}

function sourceHTML(source) {
  return source
    ? `<a class="source-link" target="_blank" rel="noopener" href="${source.url}">${source.label} ↗</a>`
    : '';
}

function cleanItemText(text) {
  return text.trim().replace(/^[^\p{L}\p{N}\s]+/u,'').trim();
}

function itemHTML(text) {
  const trimmedText=text.trim();
  const symbolMatch=trimmedText.match(/^[^\p{L}\p{N}\s]+/u);
  const symbol=symbolMatch?symbolMatch[0]:'✦';
  const cleanText=boldTravelTerms(cleanItemText(trimmedText));
  return `<li><span class="item-symbol" aria-hidden="true">${symbol}</span>${cleanText}</li>`;
}

function stopHTML(stop,index) {
  const image=stop.image||imageURL(stop.name,index+1);
  const fit=stop.imageFit==='contain'?' contain':'';
  const bulletText=stop.description.includes('<br>')
    ? stop.description.split('<br>').map(part=>part.trim()).filter(Boolean).map(itemHTML).join('')
    : '';
  const descriptionMarkup=bulletText
    ? `<ul class="stop-description-list">${bulletText}</ul>`
    : `<p>${boldTravelTerms(stop.description)}</p>`;

  return `
    ${index?'<div class="arrow"></div>':''}
    <article class="stop">
      <div class="num">${String(index+1).padStart(2,'0')}</div>
      <img class="stop-image${fit}" src="${image}" alt="${stop.name} 圖片" loading="lazy">
      <div>
        <h3>${boldTravelTerms(stop.name)}${stop.tag?`<span class="tag">${stop.tag}</span>`:''}</h3>
        ${descriptionMarkup}
      </div>
      <div class="stop-links">
        <a class="map" target="_blank" rel="noopener" href="${maps(stop.map)}">地圖 ↗</a>
        ${sourceHTML(stop.source)}
      </div>
    </article>
  `;
}

function highlightHTML(highlight) {
  const image=highlight.image||imageSources[highlight.title]||'';
  const media=image
    ? `<img loading="lazy" src="${image}" alt="${highlight.title}">`
    : `<span class="text-photo-icon">${highlight.icon||'✦'}</span>`;
  const photoClass=image?'':' text-photo';

  return `
    <section class="section-card">
      <div class="photo${photoClass}">
        ${media}
      </div>
      <h3>${boldTravelTerms(highlight.title)}</h3>
      <p>${boldTravelTerms(highlight.description)}</p>
    </section>
  `;
}

function overviewHTML(plan) {
  const overview=plan.overview;
  if (!overview) return '';
  const timeline=overview.timeline.map((stop,index)=>`
    ${index?`
      <div class="connector">
        <b>${stop.mode||'→'}</b>
        <small>${stop.note||'移動'}</small>
      </div>
    `:''}
    <div class="timeline-stop">
      <span>${boldTravelTerms(stop.name)}</span>
      ${stop.note&&!index?`<small>${stop.note}</small>`:''}
    </div>
  `).join('');

  return `
    <section class="route-overview" aria-label="路線總覽">
      <div class="section-heading overview-heading">
        <h2>路線總覽</h2>
        <p>依停靠順序掌握整體方向與移動方式，再查看下方的停靠點細節。</p>
      </div>
      <div class="chips">
        ${overview.chips.map(chip=>`<span class="chip">${boldTravelTerms(chip)}</span>`).join('')}
      </div>
      <div class="timeline" aria-label="推薦玩法時間軸">${timeline}</div>
    </section>
  `;
}

function factsHTML(plan) {
  if (!plan.facts?.length) return '';
  return `
    <section class="route-overview" aria-label="內容摘要">
      <div class="section-heading overview-heading">
        <h2>內容摘要</h2>
      </div>
      <div class="facts">
        ${plan.facts.map(fact=>`<div class="fact"><strong>${fact.value}</strong><span>${boldTravelTerms(fact.label)}</span></div>`).join('')}
      </div>
    </section>
  `;
}

function guideSectionsHTML(plan) {
  return `
    <div class="section-heading"><h2>重點內容</h2></div>
    <div class="grid">
      ${plan.sections.map(section=>`
        <section class="section-card guide-section">
          <h3>${boldTravelTerms(section.title)}</h3>
          <p>${boldTravelTerms(section.description)}</p>
          <ul>${section.items.map(itemHTML).join('')}</ul>
        </section>
      `).join('')}
    </div>
  `;
}

function tablesHTML(plan) {
  if (!plan.tables?.length) return '';
  return plan.tables.map(table=>`
    <div class="section-heading">
      <h2>${boldTravelTerms(table.title)}</h2>
      <p>${boldTravelTerms(table.description)}</p>
    </div>
    <section class="section-card table-card">
      <div class="table-wrap">
        <table class="info-table">
          <thead><tr>${table.headers.map(header=>`<th>${boldTravelTerms(header)}</th>`).join('')}</tr></thead>
          <tbody>${table.rows.map(row=>`<tr>${row.map(cell=>`<td>${boldTravelTerms(cell)}</td>`).join('')}</tr>`).join('')}</tbody>
        </table>
      </div>
    </section>
  `).join('');
}

function linksHTML(plan) {
  if (!plan.links?.length) return '';
  return `
    <div class="section-heading">
      <h2>參考連結</h2>
      <p>官方網站、參考文章與需要再次查閱的資料。</p>
    </div>
    <section class="section-card">
      <div class="link-list">
        ${plan.links.map(link=>`
          <a class="reference-link" target="_blank" rel="noopener" href="${link.url}">
            <span>${boldTravelTerms(link.label)}</span>
            <span>開啟連結 ↗</span>
          </a>
        `).join('')}
      </div>
    </section>
  `;
}

function checklistHTML(plan,title,description) {
  return `
    <div class="section-heading">
      <h2>${title}</h2>
      <p>${boldTravelTerms(description)}</p>
    </div>
    <section class="section-card">
      <div class="checklist">
        ${plan.checks.map((check,index)=>`
          <label class="check">
            <input type="checkbox" data-key="${plan.id}-${index}">
            <span>${boldTravelTerms(check)}</span>
          </label>
        `).join('')}
      </div>
    </section>
  `;
}

function renderRoutePlan(plan) {
  return `
    <section class="plan" id="${plan.id}" style="--accent:${plan.accent||'var(--blue)'}">
      ${header(plan)}
      <div class="notice"><strong>行程提醒：</strong>${boldTravelTerms(plan.notice)}</div>
      ${factsHTML(plan)}
      ${overviewHTML(plan)}
      <div class="section-heading"><h2>行程路線</h2><p>依順序列出本次行程的主要停靠點。</p></div>
      <div class="route">${plan.stops.map(stopHTML).join('')}</div>
      <div class="section-heading"><h2>特色照片與重點</h2><p>補充這套路線最具代表性的景觀或體驗。</p></div>
      <div class="grid">${plan.highlights.map(highlightHTML).join('')}</div>
      ${linksHTML(plan)}
      ${checklistHTML(plan,'Checklist',plan.checklistDescription||'Checklist 狀態會保存在目前瀏覽器。')}
    </section>
  `;
}

function renderGuidePlan(plan) {
  return `
    <section class="plan" id="${plan.id}" style="--accent:${plan.accent||'var(--blue)'}">
      ${header(plan)}
      ${plan.notice?`<div class="notice"><strong>行程提醒：</strong>${boldTravelTerms(plan.notice)}</div>`:''}
      ${factsHTML(plan)}
      ${guideSectionsHTML(plan)}
      ${tablesHTML(plan)}
      <div class="section-heading"><h2>特色照片與重點</h2><p>最具代表性的景觀、文化內容或交通筆記。</p></div>
      <div class="grid">${plan.highlights.map(highlightHTML).join('')}</div>
      ${linksHTML(plan)}
      ${checklistHTML(plan,'Checklist','請在這裡記下確認過的旅遊資訊與待辦事項。')}
    </section>
  `;
}

function renderPlan(plan) {
  return plan.type==='guide'?renderGuidePlan(plan):renderRoutePlan(plan);
}

function renderPlans() {
  planContainer.innerHTML=travelData.tabs.map(renderPlan).join('');
  restoreChecks();
}

function renderTabs() {
  const tabs=travelData.tabs.map(plan=>`
    <button class="tab" data-target="${plan.id}">
      <span class="icon">${plan.icon}</span>
      <span>${plan.label}</span>
    </button>
  `).join('');
  topTabs.innerHTML=tabs;
  bottomTabs.innerHTML=tabs;
}

function showPlan(id,updateHash=true,shouldScroll=true) {
  document.querySelectorAll('.plan').forEach(plan=>plan.classList.toggle('active',plan.id===id));
  document.querySelectorAll('[data-target]').forEach(tab=>tab.classList.toggle('active',tab.dataset.target===id));
  if (updateHash) history.replaceState(null,'',`#${id}`);
  if (shouldScroll) {
    const main=document.getElementById('planContainer');
    const sticky=document.querySelector('.sticky-tabs');
    const targetY=main?main.offsetTop-(sticky?sticky.offsetHeight:0)-12:0;
    window.scrollTo({top:Math.max(targetY,0),left:0,behavior:'smooth'});
  }
}

function restoreChecks() {
  document.querySelectorAll('[data-key]').forEach(checkbox=>{
    const key=`interlaken-town-${checkbox.dataset.key}`;
    checkbox.checked=localStorage.getItem(key)==='1';
    checkbox.onchange=()=>localStorage.setItem(key,checkbox.checked?'1':'0');
  });
}

renderTabs();
renderPlans();

document.addEventListener('click',event=>{
  const tab=event.target.closest('[data-target]');
  if (tab) showPlan(tab.dataset.target);
});

const planIds=travelData.tabs.map(plan=>plan.id);
const initialPlan=planIds.includes(location.hash.slice(1))?location.hash.slice(1):planIds[0];
showPlan(initialPlan,false,false);

window.addEventListener('hashchange',()=>{
  const id=location.hash.slice(1);
  if (planIds.includes(id)) showPlan(id,false,false);
});
</script>
</body>
</html>
